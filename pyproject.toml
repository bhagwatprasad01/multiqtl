[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "multiqtl"
version = "0.1.0"
description = "Integrated genomics x transcriptomics x proteomics QTL analysis: cis/trans/interaction eQTL & pQTL mapping, FDR suite, colocalization, MR, mediation, publication-quality output"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = ["numpy>=1.21", "scipy>=1.7", "pandas>=1.3", "matplotlib>=3.5", "pillow>=9.1", "openpyxl>=3.0", "pyyaml>=5.4"]

classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent",
               "License :: OSI Approved :: MIT License", "Topic :: Scientific/Engineering :: Bio-Informatics"]

[project.optional-dependencies]
parquet = ["pyarrow>=10"]
notebook = ["jupyterlab"]

[project.scripts]
multiqtl = "multiqtl.cli:main"

[tool.setuptools]
packages = ["multiqtl"]
