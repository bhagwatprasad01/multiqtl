# conda env create -f environment.yml && conda activate multiqtl
name: multiqtl
channels: [conda-forge]
dependencies:
  - python>=3.9
  - numpy>=1.21
  - scipy>=1.7
  - pandas>=1.3
  - matplotlib>=3.5
  - pillow>=9.1
  - openpyxl>=3.0
  - pyyaml>=5.4
  - pyarrow            # optional: Parquet output
  - jupyterlab         # optional: tutorial notebook
  - pip
  - pip:
      - -e .
